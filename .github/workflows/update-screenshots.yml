# Run by hand (Actions → Update screenshots → Run workflow) when screenshot tests fail only because CI's
# browser draws a few pixels differently from yours, or after an intentional visual change.
# It regenerates every screenshot with CI's own browser and uploads them: download the artifact, check the
# images, and commit them to test/browser/__screenshots__/.
name: Update screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: rm -f test/browser/__screenshots__/*.png
      - run: npm run test:browser -- visual || true # writes fresh baselines; "missing snapshot" failures are expected
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: screenshots
          path: test/browser/__screenshots__/
