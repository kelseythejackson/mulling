# Publishes to npm when you publish a GitHub release (e.g. tag v1.0.0), after the full test suite passes.
# One-time setup: add an npm access token as the repository secret NPM_TOKEN.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # lets npm record provenance: proof the package was built from this repo

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  publish:
    needs: browser # never publish a version whose browser tests fail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      # prepublishOnly runs the release check, lint, every non-browser test, the build, the type and
      # package checks and the size budgets before anything is uploaded.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
