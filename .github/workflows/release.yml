# Publishes to npm when you publish a GitHub release (e.g. tag v1.0.0), after the full test suite passes.
# Uses npm trusted publishing, so there's no token to set up. One-time setup on npmjs.com:
# mulling → Settings → Trusted Publisher → GitHub Actions, repo kelseythejackson/mulling, workflow release.yml.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # lets npm record provenance: proof the package was built from this repo

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build # cdn.spec.ts loads the built script-tag file
      - run: npm run test:browser

  publish:
    needs: browser # never publish a version whose browser tests fail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10. Pinned, like the actions above.
      - run: npm install -g npm@11.21.3
      # prepublishOnly runs the release check, lint, every non-browser test, the build, the type and
      # package checks and the size budgets before anything is uploaded.
      # No token: npm checks this workflow's OIDC identity (id-token: write) against the package's
      # trusted publisher, and adds provenance automatically.
      - run: npm publish --access public
