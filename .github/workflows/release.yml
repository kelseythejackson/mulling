# Publishes to npm when you publish a GitHub release (e.g. tag v1.0.0), after the full test suite passes.
# One-time setup: add an npm access token as the repository secret NPM_TOKEN.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # lets npm record provenance: proof the package was built from this repo

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  publish:
    needs: browser # never publish a version whose browser tests fail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      # prepublishOnly runs the release check, lint, every non-browser test, the build, the type and
      # package checks and the size budgets before anything is uploaded.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
