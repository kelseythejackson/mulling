name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check:actions # every action pinned to a commit SHA
      - run: npm run typecheck
      - run: npm run test:types
      - run: npm test
      - run: npm run build
      - run: npm run test:types:package # Are the Types Wrong? across node10, node16 (CJS and ESM) and bundler
      - run: npm run test:bundle # unused loaders are left out of a bundle
      - run: npm run test:package # install the packed package in a fresh project and use every entry point
      - run: npm run size
      - run: npm run check:sizes # the docs' sizes are measured, current, and never typed by hand

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build # cdn.spec.ts loads the built script-tag file
      - run: npm run test:browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      - run: npm ci # the API reference reads the library's types, including React's and Vue's
      - run: npm ci --prefix site
      - run: npm run build # the site check pastes the docs' script-tag snippets, which load the built library
      - run: npm run build:site
      - run: npm run test:site # axe on every page in light and dark, plus the interactive controls
        env:
          CHROME_PATH: /usr/bin/google-chrome # preinstalled on GitHub's Ubuntu runners
